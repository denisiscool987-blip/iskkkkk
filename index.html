<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Trouble Arena AI Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            background-color: #262626;
            display: block;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 26, 26, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ff4757;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ffa502;
        }
        .class-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            max-width: 90%;
            flex-wrap: wrap;
            justify-content: center;
        }
        .class-card {
            background: #2f3542;
            border: 3px solid #747d8c;
            border-radius: 8px;
            padding: 20px;
            width: 160px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .class-card:hover {
            transform: translateY(-5px);
            border-color: #ff4757;
            background: #3e4452;
        }
        .class-card.selected {
            border-color: #2ed573;
            background: #218c74;
            box-shadow: 0 0 15px rgba(46, 213, 115, 0.4);
        }
        .class-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .class-desc {
            font-size: 0.85rem;
            color: #ced6e0;
            line-height: 1.3;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        button:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.98);
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.2rem;
            pointer-events: none;
            z-index: 5;
            text-shadow: 1px 1px 2px black;
        }
        .player-score { color: #ff4757; }
        .ai-score { color: #1e90ff; }
        .controls-hint {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #a4b0be;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div class="player-score">PLAYER (YOU): <span id="p1-score-val">0</span></div>
        <div class="ai-score">AI BOT: <span id="ai-score-val">0</span></div>
    </div>

    <!-- MAIN MENU SCREEN -->
    <div id="menu-screen" class="screen">
        <h1>Tank Trouble Arena</h1>
        <h2>Select Your Tank Class</h2>
        
        <div class="class-selector" id="class-selector">
            <!-- Dynamic Injection -->
        </div>

        <button id="start-btn">Battle AI</button>

        <div class="controls-hint">
            <strong>Controls:</strong> Arrow Keys to Drive & Steer | Spacebar to Fire Weapon
        </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="over-screen" class="screen" style="display: none;">
        <h1 id="win-message">You Win!</h1>
        <button id="next-round-btn">Next Round</button>
    </div>

    <canvas id="gameCanvas" width="900" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game Parameters
const CELL_SIZE = 75;
const COLS = canvas.width / CELL_SIZE; // 12
const ROWS = canvas.height / CELL_SIZE; // 8

// Tank Classes Definitions
const TANK_CLASSES = {
    ranger: {
        name: "Ranger",
        desc: "High-speed scout. Rapid fire Bouncing Laser Mini-Gun (max 5 bounces).",
        speed: 3.2,
        rotSpeed: 0.06,
        cooldown: 250,
        bulletType: "laser",
        color: "#ff4757"
    },
    demolition: {
        name: "Demolition",
        desc: "Slow dreadnought. Heavy Missile detonates on contact causing explosive damage.",
        speed: 1.8,
        rotSpeed: 0.035,
        cooldown: 1200,
        bulletType: "missile",
        color: "#ffa502"
    },
    spectre: {
        name: "Spectre",
        desc: "Tactical tank. Ghost Shot passes straight through walls on its first path.",
        speed: 2.5,
        rotSpeed: 0.05,
        cooldown: 700,
        bulletType: "ghost",
        color: "#9b59b6"
    },
    shotgunner: {
        name: "Shotgunner",
        desc: "Heavy frontloader. Spreads 3 bullets in a wide spray for tight corners.",
        speed: 2.3,
        rotSpeed: 0.045,
        cooldown: 900,
        bulletType: "shotgun",
        color: "#2ed573"
    }
};

let currentClassKey = "ranger";
let scores = { player: 0, ai: 0 };
let maze, player, ai, bullets, particles;
let keys = {};
let gameActive = false;

// Generate Selection UI Cards
const classSelectorDiv = document.getElementById('class-selector');
Object.keys(TANK_CLASSES).forEach((key, idx) => {
    const cls = TANK_CLASSES[key];
    const card = document.createElement('div');
    card.className = `class-card ${key === currentClassKey ? 'selected' : ''}`;
    card.dataset.classKey = key;
    card.innerHTML = `
        <div class="class-name" style="color: ${cls.color}">${cls.name}</div>
        <div class="class-desc">${cls.desc}</div>
    `;
    card.addEventListener('click', () => {
        document.querySelectorAll('.class-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        currentClassKey = key;
    });
    classSelectorDiv.appendChild(card);
});

// Event Listeners for controls
window.addEventListener('keydown', e => { 
    keys[e.code] = true; 
    if(e.code === 'Space' && gameActive) {
        player.shoot();
        e.preventDefault();
    }
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
        e.preventDefault();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('menu-screen').style.display = 'none';
    initRound();
});

document.getElementById('next-round-btn').addEventListener('click', () => {
    document.getElementById('over-screen').style.display = 'none';
    initRound();
});

// Maze Generation Class (Kruskal's / Randomized Prim's Hybrid for clean tactical paths)
class Maze {
    constructor(cols, rows) {
        this.cols = cols;
        this.rows = rows;
        this.walls = []; // items format: {x1, y1, x2, y2} represent cell boundary edges
        this.generate();
    }

    generate() {
        // Initialize grid paths
        this.vWalls = Array(this.cols + 1).fill().map(() => Array(this.rows).fill(true));
        this.hWalls = Array(this.cols).fill().map(() => Array(this.rows + 1).fill(true));
        
        // Disjoint sets for Kruskal algorithm
        let sets = [];
        for(let r=0; r<this.rows; r++) {
            for(let c=0; c<this.cols; c++) {
                sets.push([{c, r}]);
            }
        }

        let findSet = (c, r) => sets.findIndex(s => s.some(cell => cell.c === c && cell.r === r));

        // Create internal walls collection
        let edges = [];
        for(let c=1; c<this.cols; c++) for(let r=0; r<this.rows; r++) edges.push({type: 'v', c, r});
        for(let c=0; c<this.cols; c++) for(let r=1; r<this.rows; r++) edges.push({type: 'h', c, r});
        
        // Shuffle helper
        edges.sort(() => Math.random() - 0.5);

        edges.forEach(edge => {
            let c1, r1, c2, r2;
            if (edge.type === 'v') {
                c1 = edge.c - 1; r1 = edge.r;
                c2 = edge.c;     r2 = edge.r;
            } else {
                c1 = edge.c; r1 = edge.r - 1;
                c2 = edge.c; r2 = edge.r;
            }

            let s1 = findSet(c1, r1);
            let s2 = findSet(c2, r2);

            if(s1 !== s2) {
                // Remove wall asset
                if(edge.type === 'v') this.vWalls[edge.c][edge.r] = false;
                else this.hWalls[edge.c][edge.r] = false;
                // Merge sets
                sets[s1] = sets[s1].concat(sets[s2]);
                sets.splice(s2, 1);
            }
        });

        // Add some random loops / openings for open combat layout (Classic Tank Trouble flavor)
        for(let i=0; i<15; i++) {
            let rc = Math.floor(Math.random() * (this.cols - 1)) + 1;
            let rr = Math.floor(Math.random() * (this.rows - 1)) + 1;
            if(Math.random() > 0.5) this.vWalls[rc][rr] = false;
            else this.hWalls[rc][rr] = false;
        }
    }

    draw() {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.lineCap = "round";

        // Draw boundaries and generated inner walls
        for(let c=0; c<=this.cols; c++) {
            for(let r=0; r<this.rows; r++) {
                if(c === 0 || c === this.cols || this.vWalls[c][r]) {
                    ctx.beginPath();
                    ctx.moveTo(c * CELL_SIZE, r * CELL_SIZE);
                    ctx.lineTo(c * CELL_SIZE, (r + 1) * CELL_SIZE);
                    ctx.stroke();
                }
            }
        }
        for(let c=0; c<this.cols; c++) {
            for(let r=0; r<=this.rows; r++) {
                if(r === 0 || r === this.rows || this.hWalls[c][r]) {
                    ctx.beginPath();
                    ctx.moveTo(c * CELL_SIZE, r * CELL_SIZE);
                    ctx.lineTo((c + 1) * CELL_SIZE, r * CELL_SIZE);
                    ctx.stroke();
                }
            }
        }
    }

    // Comprehensive Line segment collision lookup helper
    checkWallCollision(x, y, radius) {
        let buffer = radius;
        // Check grid walls intersections
        for(let c=0; c<=this.cols; c++) {
            for(let r=0; r<this.rows; r++) {
                if(c === 0 || c === this.cols || this.vWalls[c][r]) {
                    let wx = c * CELL_SIZE;
                    let wy1 = r * CELL_SIZE;
                    let wy2 = (r + 1) * CELL_SIZE;
                    if(y >= wy1 - buffer && y <= wy2 + buffer && Math.abs(x - wx) < buffer) {
                        return { type: 'v', wallX: wx };
                    }
                }
            }
        }
        for(let c=0; c<this.cols; c++) {
            for(let r=0; r<=this.rows; r++) {
                if(r === 0 || r === this.rows || this.hWalls[c][r]) {
                    let wy = r * CELL_SIZE;
                    let wx1 = c * CELL_SIZE;
                    let wx2 = (c + 1) * CELL_SIZE;
                    if(x >= wx1 - buffer && x <= wx2 + buffer && Math.abs(y - wy) < buffer) {
                        return { type: 'h', wallY: wy };
                    }
                }
            }
        }
        return null;
    }
}

// Tank Handler Entity
class Tank {
    constructor(x, y, angle, config, isAI) {
        this.x = x;
        this.y = y;
        this.angle = angle; // Radians
        this.config = config;
        this.isAI = isAI;
        this.radius = 16;
        this.lastShotTime = 0;
        this.aiTargetAngle = angle;
        this.aiStateTimer = 0;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Body Structure Chassis
        ctx.fillStyle = this.config.color;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.fillRect(-this.radius, -this.radius + 2, this.radius * 2, this.radius * 2 - 4);
        ctx.strokeRect(-this.radius, -this.radius + 2, this.radius * 2, this.radius * 2 - 4);

        // Treads
        ctx.fillStyle = "#333333";
        ctx.fillRect(-this.radius - 2, -this.radius - 1, this.radius * 2 + 4, 4);
        ctx.fillRect(-this.radius - 2, this.radius - 3, this.radius * 2 + 4, 4);

        // Turret Barrel Gun
        ctx.fillStyle = "#dcdde1";
        ctx.fillRect(0, -4, this.radius + 6, 8);
        ctx.strokeRect(0, -4, this.radius + 6, 8);
        ctx.fillStyle = this.config.color;
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    move(forward) {
        let dir = forward ? 1 : -0.6;
        let speed = this.config.speed * dir;
        let nextX = this.x + Math.cos(this.angle) * speed;
        let nextY = this.y + Math.sin(this.angle) * speed;

        // Sliding collision calculation pipeline
        let collX = maze.checkWallCollision(nextX, this.y, this.radius);
        if(!collX) this.x = nextX;
        
        let collY = maze.checkWallCollision(this.x, nextY, this.radius);
        if(!collY) this.y = nextY;
    }

    rotate(dir) {
        this.angle += this.config.rotSpeed * dir;
    }

    shoot() {
        let now = Date.now();
        if(now - this.lastShotTime < this.config.cooldown) return;
        this.lastShotTime = now;

        let barrelX = this.x + Math.cos(this.angle) * (this.radius + 8);
        let barrelY = this.y + Math.sin(this.angle) * (this.radius + 8);

        if(this.config.bulletType === 'shotgun') {
            let spreads = [-0.2, 0, 0.2];
            spreads.forEach(sp => {
                bullets.push(new Bullet(barrelX, barrelY, this.angle + sp, 4.5, 'normal', this.isAI));
            });
        } else {
            let bSpeed = this.config.bulletType === 'laser' ? 6 : (this.config.bulletType === 'missile' ? 3.5 : 4);
            bullets.push(new Bullet(barrelX, barrelY, this.angle, bSpeed, this.config.bulletType, this.isAI));
        }
    }

    updateAI() {
        if(!this.isAI) return;
        this.aiStateTimer--;

        // Calculate simple analytical tracking vector towards Player
        let dx = player.x - this.x;
        let dy = player.y - this.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        let targetAngle = Math.atan2(dy, dx);

        // Normalize target wrap angle matching standard tracking systems
        let angleDiff = targetAngle - this.angle;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;

        // Steering execution routine
        if(angleDiff > 0.05) this.rotate(1);
        else if(angleDiff < -0.05) this.rotate(-1);

        // Basic Line-of-sight tracking setup / Obstacle interaction framework
        if(this.aiStateTimer <= 0) {
            this.aiStateTimer = Math.floor(Math.random() * 40) + 20;
            // Raycast check or random override to un-stuck AI from tight cells
            this.aiMoveForward = Math.random() > 0.15;
        }

        if(this.aiMoveForward) {
            this.move(true);
        } else {
            this.rotate(Math.random() > 0.5 ? 1 : -1);
        }

        // Fire logic check: shoot if facing target somewhat accurately
        if(dist < 400 && Math.abs(angleDiff) < 0.3 && Math.random() < 0.04) {
            this.shoot();
        }
    }
}

// Projectile Object Blueprint
class Bullet {
    constructor(x, y, angle, speed, type, isAI) {
        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.type = type;
        this.isAI = isAI;
        this.radius = type === 'missile' ? 6 : 4;
        this.bounces = 0;
        this.maxBounces = type === 'laser' ? 5 : (type === 'shotgun' ? 1 : 3);
        this.life = type === 'shotgun' ? 120 : 360; // Frame lifetimes
        this.ghostPhased = type === 'ghost'; // Starts phased out
    }

    update() {
        this.life--;
        let nextX = this.x + this.vx;
        let nextY = this.y + this.vy;

        if (this.ghostPhased) {
            // Spectre ghost tracking logic: stays ghosted until first clear cell area
            let hitWall = maze.checkWallCollision(nextX, nextY, this.radius);
            if(!hitWall && this.bounces === 0 && this.life < 330) {
                // No wall currently intercepting, phase back in
                this.ghostPhased = false;
            }
            this.x = nextX;
            this.y = nextY;
            return;
        }

        // Elastic dynamic boundary bounce computations
        let collision = maze.checkWallCollision(nextX, nextY, this.radius);
        if (collision) {
            if(this.type === 'missile') {
                this.detonate();
                return;
            }
            
            if (collision.type === 'v') {
                this.vx *= -1;
                this.x = this.x + this.vx; // Quick pushback out of geometric overlap
            } else {
                this.vy *= -1;
                this.y = this.y + this.vy;
            }
            this.bounces++;
            
            // Add visual sparks on impacts
            createSparks(this.x, this.y, '#ffffff', 4);
        } else {
            this.x = nextX;
            this.y = nextY;
        }
    }

    draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        
        if (this.ghostPhased) {
            ctx.fillStyle = "rgba(155, 89, 182, 0.4)";
            ctx.strokeStyle = "#9b59b6";
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            ctx.fillStyle = this.type === 'laser' ? '#ff4757' : (this.type === 'missile' ? '#ffa502' : '#ffffff');
            ctx.fill();
        }
        ctx.restore();
    }

    detonate() {
        this.life = 0; // Kills bullet instance
        createSparks(this.x, this.y, '#ffa502', 30);
        
        // Circular structural explosion splash matrix radius
        let splashRadius = 65;
        [player, ai].forEach(tank => {
            let dx = tank.x - this.x;
            let dy = tank.y - this.y;
            if(Math.sqrt(dx*dx + dy*dy) < splashRadius) {
                handleKill(tank.isAI ? 'player' : 'ai');
            }
        });
    }
}

// Particle system configurations
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 3 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.color = color;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.015;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 3, 3);
        ctx.restore();
    }
}

function createSparks(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push(new Particle(x, y, color));
    }
}

// Initialization routine per battle round setup
function initRound() {
    maze = new Maze(COLS, ROWS);
    bullets = [];
    particles = [];

    // Safety spatial coordinate separation positioning grid arrays
    let pX = CELL_SIZE * 0.5;
    let pY = CELL_SIZE * 0.5;
    let aiX = canvas.width - (CELL_SIZE * 0.5);
    let aiY = canvas.height - (CELL_SIZE * 0.5);

    // Dynamic configuration assignations
    player = new Tank(pX, pY, 0, TANK_CLASSES[currentClassKey], false);
    
    // Choose random class layout variant profile for AI opponent challenge
    let aiClasses = Object.keys(TANK_CLASSES);
    let randomAIClass = aiClasses[Math.floor(Math.random() * aiClasses.length)];
    ai = new Tank(aiX, aiY, Math.PI, TANK_CLASSES[randomAIClass], true);

    gameActive = true;
}

function handleKill(winner) {
    if(!gameActive) return;
    gameActive = false;

    if(winner === 'player') {
        scores.player++;
        document.getElementById('p1-score-val').innerText = scores.player;
        document.getElementById('win-message').innerText = "You Destroyed the AI!";
        document.getElementById('win-message').style.color = "#2ed573";
    } else {
        scores.ai++;
        document.getElementById('ai-score-val').innerText = scores.ai;
        document.getElementById('win-message').innerText = "The AI Outsmarted You!";
        document.getElementById('win-message').style.color = "#ff4757";
    }

    createSparks(player.x, player.y, player.config.color, 40);
    createSparks(ai.x, ai.y, ai.config.color, 40);

    setTimeout(() => {
        document.getElementById('over-screen').style.display = 'flex';
    }, 1000);
}

// Global Execution game Loop loop engine tick
function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (maze) maze.draw();

    if (gameActive) {
        // Human Engine Input processing
        if (keys['ArrowLeft']) player.rotate(-1);
        if (keys['ArrowRight']) player.rotate(1);
        if (keys['ArrowUp']) player.move(true);
        if (keys['ArrowDown']) player.move(false);

        // Computer AI update routine calls
        ai.updateAI();

        // Object Tracking Pipelines updating looping bounds array structure systems
        bullets.forEach((b, idx) => {
            b.update();
            if (b.life <= 0 || b.bounces > b.maxBounces) {
                bullets.splice(idx, 1);
                return;
            }

            // Standard Bullet collision hitboxes calculation evaluations
            let distP = Math.sqrt((b.x - player.x)**2 + (b.y - player.y)**2);
            let distAI = Math.sqrt((b.x - ai.x)**2 + (b.y - ai.y)**2);

            // Evade evaluation context logic checks
            if(!b.ghostPhased) {
                if (distP < player.radius) {
                    handleKill('ai');
                    bullets.splice(idx, 1);
                } else if (distAI < ai.radius) {
                    handleKill('player');
                    bullets.splice(idx, 1);
                }
            }
        });
    }

    // Always draw existing objects if initialized
    if(player) player.draw();
    if(ai) ai.draw();
    
    bullets.forEach(b => b.draw());
    
    particles.forEach((p, idx) => {
        p.update();
        if(p.alpha <= 0) particles.splice(idx, 1);
        else p.draw();
    });

    requestAnimationFrame(loop);
}

// Start loop engine ticker
loop();
</script>
</body>
</html>
